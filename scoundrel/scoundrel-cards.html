<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>scoundrel-cards</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background:
		radial-gradient(circle at top, rgba(34, 76, 72, 0.72), rgba(6, 10, 12, 0.98) 58%),
		#040607;
		overflow: hidden;
	touch-action: none;
		font-family: Inter, "Segoe UI", Arial, sans-serif;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
}

#canvas:focus {
	outline: none;
}

#overlay {
	position: fixed;
	inset: 0;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 24px;
	background: rgba(4, 7, 8, 0.84);
	backdrop-filter: blur(10px);
	z-index: 10;
}

#panel {
	width: min(440px, 100%);
	padding: 28px 24px;
	border: 1px solid rgba(173, 255, 238, 0.18);
	border-radius: 20px;
	background: linear-gradient(180deg, rgba(18, 28, 30, 0.96), rgba(9, 14, 16, 0.96));
	box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
	text-align: center;
}

#splash {
	max-width: min(256px, 70vw);
	max-height: 192px;
	margin-bottom: 18px;
}

#title {
	margin: 0 0 10px;
	font-size: 28px;
	letter-spacing: 0.04em;
}

#subtitle {
	margin: 0 0 20px;
	color: rgba(232, 244, 241, 0.82);
	font-size: 15px;
	line-height: 1.45;
}

#start-button {
	width: 100%;
	padding: 14px 16px;
	border: none;
	border-radius: 999px;
	background: linear-gradient(180deg, #56f3cb, #25b993);
	color: #052018;
	font-size: 16px;
	font-weight: 700;
	cursor: pointer;
	transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
}

#start-button:hover,
#start-button:focus-visible {
	transform: translateY(-1px);
	filter: brightness(1.04);
}

#start-button[disabled] {
	cursor: wait;
	opacity: 0.7;
	transform: none;
}

#progress {
	width: 100%;
	height: 10px;
	margin-top: 16px;
	accent-color: #56f3cb;
	display: none;
}

#status {
	margin-top: 14px;
	min-height: 1.4em;
	color: rgba(232, 244, 241, 0.78);
	font-size: 14px;
	line-height: 1.4;
	white-space: pre-wrap;
}

.hidden {
	display: none !important;
}
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="overlay">
			<div id="panel">
				<img id="splash" class="show-image--true fullsize--true use-filter--true" src="scoundrel-cards.png" alt="">
				<h1 id="title">SCOUNDREL</h1>
				<p id="subtitle">Tap or click to start.</p>
				<button id="start-button" type="button">Start</button>
				<progress id="progress"></progress>
				<div id="status">Ready.</div>
			</div>
		</div>

		<script src="scoundrel-cards.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"scoundrel-cards","experimentalVK":false,"fileSizes":{"scoundrel-cards.pck":17402168,"scoundrel-cards.wasm":38057390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const overlay = document.getElementById("overlay");
const startButton = document.getElementById("start-button");
const progressBar = document.getElementById("progress");
const status = document.getElementById("status");
const trackedAudioContexts = [];
let isStarting = false;
let engine = null;

const NativeAudioContext = window.AudioContext || window.webkitAudioContext;

if (NativeAudioContext) {
	function TrackingAudioContext() {
		const context = new NativeAudioContext(...arguments);
		trackedAudioContexts.push(context);
		return context;
	}

	TrackingAudioContext.prototype = NativeAudioContext.prototype;
	window.AudioContext = TrackingAudioContext;
	if (window.webkitAudioContext) {
		window.webkitAudioContext = TrackingAudioContext;
	}
}

function setStatus(text) {
	status.textContent = text;
}

function showFailureNotice(err) {
	console.error(err);
	startButton.disabled = false;
	isStarting = false;
	progressBar.classList.add("hidden");
	const message = err instanceof Error ? err.message : String(err);
	setStatus(message || "An unknown error occurred while starting the game.");
}

function resumeTrackedAudioContexts() {
	if (trackedAudioContexts.length === 0) {
		return Promise.resolve();
	}

	return Promise.allSettled(trackedAudioContexts.map(function(context) {
		if (!context || typeof context.resume !== "function") {
			return Promise.resolve();
		}
		if (context.state === "running") {
			return Promise.resolve();
		}
		return context.resume();
	}));
}

function startGameFromUserGesture() {
	if (isStarting) {
		return;
	}
	isStarting = true;
	startButton.disabled = true;
	progressBar.classList.remove("hidden");
	progressBar.style.display = "block";
	setStatus("Loading...");
	if (engine == null) {
		engine = new Engine(GODOT_CONFIG);
	}

	resumeTrackedAudioContexts().then(function() {
		return engine.startGame({
		canvas: document.getElementById("canvas"),
		onProgress: function(current, total) {
			if (current > 0 && total > 0) {
				progressBar.value = current;
				progressBar.max = total;
				setStatus("Loading... " + Math.round((current / total) * 100) + "%");
			} else {
				progressBar.removeAttribute("value");
				progressBar.removeAttribute("max");
				setStatus("Loading...");
			}
		},
		});
	}).then(function() {
		return resumeTrackedAudioContexts();
	}).then(function() {
		overlay.remove();
	}).catch(showFailureNotice);
}

startButton.addEventListener("click", startGameFromUserGesture);
startButton.addEventListener("touchend", function(event) {
	if (event.cancelable) {
		event.preventDefault();
	}
	startGameFromUserGesture();
}, { passive: false });
window.addEventListener("keydown", function(event) {
	if (event.key === "Enter" || event.key === " ") {
		startGameFromUserGesture();
	}
});
		</script>
	</body>
</html>
