<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tali</title>
    <style>
      :root {
        color-scheme: dark;
        --page-bg: #071012;
        --panel-bg: rgba(8, 19, 21, 0.86);
        --panel-border: rgba(110, 255, 219, 0.22);
        --text-main: #f1fbf8;
        --text-muted: rgba(241, 251, 248, 0.74);
        --accent: #56f3cb;
        --accent-strong: #1bb18d;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at top, rgba(46, 116, 103, 0.45), transparent 42%),
          linear-gradient(180deg, #0b1719 0%, var(--page-bg) 100%);
        color: var(--text-main);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .page {
        width: min(960px, 100%);
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--panel-border);
        border-radius: 28px;
        background: var(--panel-bg);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(10px);
      }

      .banner {
        display: block;
        width: 100%;
        height: auto;
      }

      .content {
        padding: 28px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.04em;
      }

      p {
        margin: 0;
        color: var(--text-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 120ms ease, filter 120ms ease, background 120ms ease;
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-1px);
        filter: brightness(1.04);
      }

      .button-primary {
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: #06211a;
      }

      .button-secondary {
        border: 1px solid rgba(110, 255, 219, 0.28);
        background: rgba(255, 255, 255, 0.03);
        color: var(--text-main);
      }

      .note {
        margin-top: 16px;
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        .content {
          padding: 22px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <img class="banner" src="banner.png" alt="Tali banner">
        <div class="content">
          <h1>Tali</h1>
          <p>Tali is available as a Windows download. The zip includes tali.exe and tali.pck.</p>
          <div class="actions">
            <a class="button button-primary" href="https://download-tali-downbeat.s3.us-east-1.amazonaws.com/tali-windows.zip" download="tali-windows.zip">Download Windows build (.zip)</a>
            <a class="button button-secondary" href="/games/tali">View game details</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
